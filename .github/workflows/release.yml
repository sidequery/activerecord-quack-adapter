name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested adapter gem to RubyGems
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: mkdir pkg && gem build activerecord-quack-adapter.gemspec --output pkg/activerecord-quack-adapter-0.1.0.gem
      - uses: actions/upload-artifact@v6
        with:
          name: adapter-gem
          path: pkg/*.gem
          if-no-files-found: error
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        rails: ['7.2.4', '8.0.5.1', '8.1.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v7
        with:
          name: adapter-gem
          path: pkg
      - name: Block Rust tools
        run: |
          mkdir "$RUNNER_TEMP/no-rust"
          for tool in cargo rustc; do
            printf '#!/bin/sh\necho "Unexpected Rust build" >&2\nexit 1\n' > "$RUNNER_TEMP/no-rust/$tool"
            chmod +x "$RUNNER_TEMP/no-rust/$tool"
          done
          echo "$RUNNER_TEMP/no-rust" >> "$GITHUB_PATH"
      - run: gem install railties activerecord -v "$RAILS_VERSION" --no-document && gem install minitest -v '~> 5.25' --no-document
        env:
          RAILS_VERSION: ${{ matrix.rails }}
      - run: gem install pkg/*.gem --conservative --no-document
      - run: script/test
        env:
          QUACK_TEST_INSTALLED: '1'
          RAILS_VERSION: ${{ matrix.rails }}
  publish:
    if: inputs.publish
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v7
        with:
          name: adapter-gem
          path: pkg
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - run: gem push pkg/*.gem
